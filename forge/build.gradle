plugins { id 'com.gradleup.shadow' }

// Forge 1.20.1 is the corrected revision of the previously published 2.1.0.
version = "${rootProject.mod_version}-r1"

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "attracttochat.common.mixins.json"
        mixinConfig "attracttochat.forge.mixins.json"
    }
}

configurations {
    common       { canBeResolved = true; canBeConsumed = false }
    shadowBundle { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    def props = [
        version              : project.version,
        minecraft_version    : rootProject.minecraft_version,
        forge_version        : rootProject.forge_version,
        loader_version_range : "[47,)",
        mod_id               : "attracttochat",
        mod_name             : "Attract-To-Chat",
        mod_license          : "MIT"
    ]
    inputs.properties props

    filesMatching('META-INF/mods.toml') { expand props }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

shadowJar {
    configurations    = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
    input.set shadowJar.archiveFile
    archiveClassifier = ''
}
